version: "3.8"

services:
  neoclaw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: latest
    ports:
      - "7861:7861"  # OpenClaw Gateway
      - "7862:7862"  # NeoClaw Dashboard
    env_file:
      - .env
    environment:
      - NEOCLAW_PLATFORM=local
    volumes:
      - neoclaw-workspace:/root/.openclaw/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7862/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  neoclaw-workspace:
    driver: local
